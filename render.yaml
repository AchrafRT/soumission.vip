services:
  - type: web
    name: soumission-vip
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: DEV_PASSWORD
        sync: false
      - key: ENABLE_DEMO
        value: "0"
      - key: DATA_DIR
        value: /var/data/soumission-vip
    disk:
      name: soumission-vip-data
      mountPath: /var/data
      sizeGB: 1
