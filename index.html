<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soumission.VIP</title>
<style>
:root{
  --ink:#0b1424;--muted:#667085;--line:#dce4f0;--bg:#eef3fb;--card:#fff;
  --accent:#5b5cf0;--accent2:#2d7ff9;--cyan:#18b6d9;--good:#16a66a;--warn:#e58a18;--danger:#d83f52;
  --gold:#ffbe3f;--sidebar:#08111f;--sidebar2:#101f38;--shadow:0 18px 45px rgba(19,42,77,.12);
  --shadow3d:0 2px 0 #d6deea,0 8px 0 #c3cfdf,0 20px 45px rgba(19,42,77,.16);
  --radius:20px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:
radial-gradient(circle at 12% 8%,rgba(91,92,240,.12),transparent 28%),
radial-gradient(circle at 88% 18%,rgba(24,182,217,.10),transparent 24%),
linear-gradient(180deg,#f8fbff 0,#eef3fb 55%,#eaf0f8 100%);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
a{color:inherit}.muted{color:var(--muted)}.small{font-size:12px}.spacer{flex:1}.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eff3f9;border:1px solid #dce4ef;padding:2px 6px;border-radius:7px;color:#334155}

/* tactile controls */
.btn{position:relative;border:1px solid rgba(26,48,84,.12);border-radius:13px;padding:10px 15px;font-weight:800;background:linear-gradient(180deg,#f8faff,#edf2fa);color:#273a59;box-shadow:0 3px 0 #d6deea,0 8px 18px rgba(32,57,94,.08);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;letter-spacing:-.01em}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #d1dae7,0 12px 24px rgba(32,57,94,.12);filter:brightness(1.015)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d1dae7,0 4px 8px rgba(32,57,94,.08)}
.btn.primary{color:#fff;border-color:#4648da;background:linear-gradient(145deg,#7475ff,#5556ed 55%,#4448d7);box-shadow:0 4px 0 #3839ad,0 12px 26px rgba(78,78,225,.28)}
.btn.primary:hover{box-shadow:0 6px 0 #3839ad,0 17px 30px rgba(78,78,225,.34)}
.btn.dark{color:#fff;border-color:#091426;background:linear-gradient(145deg,#1d2d49,#0b1526);box-shadow:0 4px 0 #030812,0 12px 26px rgba(5,12,24,.22)}
.btn.danger{color:#a72b3c;background:linear-gradient(180deg,#fff3f5,#ffe7eb);box-shadow:0 3px 0 #f1bbc4,0 7px 16px rgba(164,39,57,.08)}
.btn.ghost{background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 3px 0 #dbe3ee}
.btn.big{padding:14px 20px;border-radius:15px;font-size:15px}.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:850;color:#41516b;letter-spacing:.02em}
.field input,.field select,.field textarea,input[type="text"],input[type="search"]{border:1px solid #cfd9e8;border-radius:12px;padding:11px 12px;background:linear-gradient(180deg,#fff,#fbfdff);color:#152238;outline:none;box-shadow:inset 0 1px 2px rgba(16,36,65,.04),0 1px 0 #fff;transition:border .18s,box-shadow .18s,transform .18s}
.field input:focus,.field select:focus,.field textarea:focus,input:focus,select:focus,textarea:focus{border-color:#7778f1;box-shadow:0 0 0 4px rgba(91,92,240,.12);transform:translateY(-1px)}

/* cards / game depth */
.card{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.98),rgba(249,252,255,.96));border:1px solid rgba(176,192,215,.55);border-radius:var(--radius);padding:20px;box-shadow:0 2px 0 #d8e1ed,0 9px 0 #cdd8e6,var(--shadow);transform-style:preserve-3d;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 3px 0 #d8e1ed,0 11px 0 #cbd6e5,0 26px 55px rgba(19,42,77,.16)}
.card h1,.card h2,.card h3{letter-spacing:-.035em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:linear-gradient(180deg,#f0f0ff,#e4e8ff);border:1px solid #d2d5ff;color:#4545b9;font-size:11px;font-weight:850;box-shadow:0 2px 0 #cdd2f5;text-transform:none}
.pill.good{background:#e7fbf2;border-color:#c0eedb;color:#11784f;box-shadow:0 2px 0 #b7e1d1}.pill.gold{background:#fff7dc;border-color:#f5df91;color:#8a5b00;box-shadow:0 2px 0 #efd77e}
.metric{font-size:35px;font-weight:950;margin-top:8px;letter-spacing:-.06em;color:#13223a}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.notice{padding:12px 14px;border-radius:13px;background:#fff8df;border:1px solid #f3dda0;color:#784e00;font-size:13px;box-shadow:0 3px 0 #ecd895}.ok{background:#e9fbf4;color:#0c754b;border-color:#bce8d5}

/* quest components */
.quest-shell{perspective:1200px}.quest-card{overflow:hidden;isolation:isolate}.quest-card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(91,92,240,.08),transparent 35%,rgba(24,182,217,.06));pointer-events:none;z-index:-1}
.quest-card:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-45px;top:-55px;background:radial-gradient(circle,rgba(115,116,255,.24),rgba(115,116,255,0) 70%);pointer-events:none}
.quest-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:950;color:#6566d9}.quest-title{font-size:22px;margin:5px 0 8px;letter-spacing:-.04em}.quest-reward{font-size:12px;font-weight:800;color:#8a6207}.quest-row{display:grid;grid-template-columns:44px 1fr auto;gap:13px;align-items:center;padding:12px 0;border-bottom:1px dashed #dce4ef}.quest-row:last-child{border-bottom:0}.quest-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f3f4ff,#e3e8ff);border:1px solid #d0d6f8;box-shadow:0 3px 0 #c8d0ee;font-weight:950;color:#5556c5}.quest-icon.done{background:linear-gradient(145deg,#e8fbf3,#cdf2df);border-color:#b7e4cf;color:#157a51;box-shadow:0 3px 0 #b0daca}
.xpbar{height:13px;border-radius:999px;background:#dfe7f2;border:1px solid #d1dce9;box-shadow:inset 0 2px 4px rgba(31,55,89,.09);overflow:hidden}.xpbar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#655ff7,#6988ff 55%,#27c1df);box-shadow:0 0 18px rgba(91,92,240,.38);transition:width .5s ease}.xptext{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#596a83;margin:6px 1px 0}
.level-orb{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#fff4c7,#ffc94e);border:1px solid #f0bd3f;box-shadow:0 4px 0 #d99d22,0 10px 24px rgba(214,151,26,.25);font-size:20px;font-weight:950;color:#6d4900;transform:rotate(-2deg)}
.reward-chip{padding:8px 11px;border-radius:12px;background:#fff8de;border:1px solid #f1df9f;box-shadow:0 3px 0 #e7d38d;font-size:12px;font-weight:800;color:#70500a}

/* auth */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:30px;background:
radial-gradient(circle at 20% 20%,rgba(91,92,240,.22),transparent 30%),radial-gradient(circle at 80% 10%,rgba(24,182,217,.18),transparent 27%),linear-gradient(145deg,#f8fbff,#eaf0fb)}
.auth{width:min(560px,94vw);transform:rotateX(.6deg)}.auth:before{content:"QUEST ACCESS";position:absolute;right:20px;top:18px;font-size:9px;font-weight:950;letter-spacing:.17em;color:#9aa7ba}.logo{width:44px;height:44px;border-radius:14px;object-fit:cover;background:linear-gradient(145deg,#6e70ff,#4d50de);display:grid;place-items:center;font-weight:950;color:#fff;border:1px solid #4547c8;box-shadow:0 4px 0 #383aa5,0 10px 22px rgba(70,72,200,.25)}

/* admin */
.admin{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:radial-gradient(circle at 30% 8%,rgba(96,102,255,.22),transparent 28%),linear-gradient(180deg,var(--sidebar2),var(--sidebar));color:#dce5f3;padding:18px 14px;position:sticky;top:0;height:100vh;box-shadow:inset -1px 0 rgba(255,255,255,.06),10px 0 35px rgba(7,17,31,.12);z-index:30;overflow:auto}.sidebar .brand{color:#fff;padding:7px 10px 16px;font-weight:950;font-size:18px;letter-spacing:-.04em}.sidebar-profile{margin:0 6px 15px;padding:12px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.13)}
.navbtn{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#aebbd0;padding:10px 12px;border-radius:12px;margin:2px 0;font-weight:730;transition:.18s}.navbtn.active,.navbtn:hover{background:linear-gradient(145deg,rgba(109,113,255,.24),rgba(61,79,134,.18));border-color:rgba(158,169,255,.16);color:#fff;transform:translateX(3px);box-shadow:inset 3px 0 #7476ff}.content{min-width:0}.topbar{min-height:70px;border-bottom:1px solid rgba(185,198,216,.7);background:rgba(248,251,255,.82);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:11px 23px;position:sticky;top:0;z-index:20;box-shadow:0 8px 22px rgba(35,61,94,.05)}.page{padding:26px;max-width:1500px;margin:auto}.top-title{font-weight:950;letter-spacing:-.03em}.top-sub{font-size:11px;color:#738199;margin-top:3px}.metric-card{min-height:125px}.metric-label{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em;color:#7a879a}
.table-wrap{overflow:auto;border-radius:15px;border:1px solid #e1e7ef}.table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.55)}.table th,.table td{padding:11px 12px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:top}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#728096;background:#f7f9fc;position:sticky;top:0}.table tr:hover td{background:#f8fbff}.tree-row{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f6}.tree-child{padding-left:25px}.angle{font-size:10px;color:#8290a5}

/* public / marketplace */
.public-head{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(190,202,220,.75);padding:12px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:40;box-shadow:0 8px 24px rgba(31,55,89,.06)}
.public-hero{position:relative;overflow:hidden;padding:70px 24px 62px;text-align:center;background:radial-gradient(circle at 16% 20%,rgba(111,113,255,.35),transparent 25%),radial-gradient(circle at 84% 12%,rgba(31,195,224,.23),transparent 23%),linear-gradient(145deg,#0c1730,#15294d 58%,#0d203d);color:#fff;border-bottom:1px solid #263e68;box-shadow:inset 0 -1px rgba(255,255,255,.06)}
.public-hero:before,.public-hero:after{content:"";position:absolute;border-radius:35%;border:1px solid rgba(255,255,255,.08);transform:rotate(35deg);pointer-events:none}.public-hero:before{width:280px;height:280px;left:-145px;bottom:-160px;background:linear-gradient(145deg,rgba(107,110,255,.08),transparent)}.public-hero:after{width:240px;height:240px;right:-120px;top:-130px;background:linear-gradient(145deg,rgba(34,204,228,.09),transparent)}
.hero-inner{position:relative;z-index:2;max-width:1120px;margin:auto}.public-hero h1{font-size:clamp(40px,6vw,72px);line-height:.98;margin:14px auto 17px;max-width:980px;letter-spacing:-.065em;text-wrap:balance}.public-hero .hero-copy{font-size:17px;line-height:1.55;color:#cdd8eb;max-width:760px;margin:0 auto}.hero-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.hero-actions .btn.ghost{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.17);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);color:#e3e8ff;font-size:11px;font-weight:850;box-shadow:inset 0 1px rgba(255,255,255,.08)}
.hero-console{margin:34px auto 0;max-width:920px;padding:10px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.15);box-shadow:0 10px 0 rgba(0,0,0,.18),0 26px 65px rgba(0,0,0,.28);transform:perspective(1100px) rotateX(2deg)}
.searchbox{margin:0;display:grid;grid-template-columns:1fr 220px 145px;background:#fff;border:1px solid #d6deeb;border-radius:14px;padding:7px;box-shadow:inset 0 1px #fff}.searchbox input,.searchbox select{border:0;padding:13px;outline:0;background:transparent}.searchbox input:focus,.searchbox select:focus{box-shadow:none;transform:none}.public-main{max-width:1240px;margin:auto;padding:32px 24px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:38px 0 15px}.section-head h2{font-size:31px;letter-spacing:-.055em;margin:0}.section-head p{margin:4px 0 0;color:#6a788d}.quest-path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:quest}.path-card{counter-increment:quest}.path-card:before{content:counter(quest);position:absolute;right:18px;top:13px;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#fff5c8,#ffc84a);border:1px solid #efbb3d;box-shadow:0 3px 0 #d89d21;color:#684600;font-size:13px;font-weight:950}.path-card h3{padding-right:45px}.value-stack{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.offer-panel{background:radial-gradient(circle at 90% 0,rgba(101,102,245,.13),transparent 32%),linear-gradient(155deg,#fff,#f7f9ff)}.bonus-row{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:13px}.bonus-check{width:25px;height:25px;border-radius:9px;display:grid;place-items:center;background:#e8fbf3;color:#117a50;border:1px solid #bde8d5;box-shadow:0 2px 0 #aedbc8;font-weight:950}.candor-card{background:linear-gradient(155deg,#111e35,#182d50);color:#fff;border-color:#294365;box-shadow:0 3px 0 #0c1729,0 10px 0 #07111e,0 24px 50px rgba(8,18,34,.26)}.candor-card .muted{color:#b9c7da}.statline{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:22px}.public-stat{padding:9px 13px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#cfdaec}.public-stat b{color:#fff;font-size:15px}.listing{display:flex;gap:14px}.listing .logo{flex:0 0 54px;width:54px;height:54px}.listing-actions{display:flex;gap:8px;flex-wrap:wrap}.job-card .pill{margin-bottom:7px}.footer{padding:32px;text-align:center;color:#6a788d;border-top:1px solid var(--line);background:rgba(255,255,255,.75);margin-top:45px}.footer b{color:#27374f}
.lead-card{background:radial-gradient(circle at 90% 15%,rgba(255,190,63,.20),transparent 28%),linear-gradient(145deg,#fffdf5,#fff7dd);border-color:#edd99b;box-shadow:0 2px 0 #eadcae,0 9px 0 #decf9b,0 22px 45px rgba(132,99,21,.12)}

/* portal */
.portal-hero{margin-bottom:18px;background:radial-gradient(circle at 90% 0,rgba(100,102,245,.16),transparent 35%),linear-gradient(155deg,#fff,#f7f9ff)}.portal-level{display:flex;align-items:center;gap:13px}.portal-main{max-width:1260px;margin:auto;padding:28px 24px}

/* modals */
.modal{position:fixed;inset:0;background:rgba(6,13,26,.70);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;padding:20px}.modal>.box{width:min(620px,95vw);max-height:90vh;overflow:auto;background:linear-gradient(155deg,#fff,#f8fbff);border:1px solid #dae3ef;border-radius:22px;padding:22px;box-shadow:0 6px 0 #c7d2e0,0 28px 80px rgba(0,0,0,.35);animation:modalIn .22s ease}.toast{position:fixed;right:18px;bottom:18px;z-index:999;color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 4px 0 rgba(0,0,0,.22),0 14px 36px rgba(0,0,0,.24);max-width:430px;font-weight:750;animation:toastIn .24s ease}.toast.okt{background:linear-gradient(145deg,#20ad74,#13875a)}.toast.badt{background:linear-gradient(145deg,#e24c5f,#b82e40)}
@keyframes modalIn{from{opacity:0;transform:translateY(15px) scale(.98)}to{opacity:1;transform:none}}@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media(max-width:1050px){.admin{grid-template-columns:220px 1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.value-stack{grid-template-columns:1fr}.quest-path{grid-template-columns:1fr}.searchbox{grid-template-columns:1fr 180px 130px}}
@media(max-width:820px){.admin{grid-template-columns:1fr}.sidebar{height:auto;position:relative;display:flex;gap:5px;align-items:center;overflow:auto;padding:9px}.sidebar .brand{padding:8px;white-space:nowrap}.sidebar-profile{display:none}.sidebar .navbtn{width:auto;white-space:nowrap}.sidebar>div:last-child{position:static!important;display:flex!important}.topbar{top:0}.g4,.g3,.g2{grid-template-columns:1fr}.searchbox{grid-template-columns:1fr}.public-hero{padding:52px 18px}.public-main,.portal-main,.page{padding:20px 16px}.public-head{padding:10px 13px}.public-head .hide-mobile{display:none}.tree-row{grid-template-columns:90px 1fr}.tree-row>:last-child{display:none}.section-head{align-items:flex-start;flex-direction:column}.public-hero h1{font-size:42px}.hero-console{transform:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}.card:hover,.btn:hover{transform:none}}

.color-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.color-field{padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}.color-field input{width:100%;height:42px;border:0;padding:0;background:transparent;cursor:pointer}
.market-card{padding:0!important;overflow:hidden}.market-cover{height:104px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--cyan));position:relative;background-size:cover;background-position:center}.market-cover:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.25),transparent 28%),linear-gradient(115deg,transparent,rgba(255,255,255,.08),transparent)}.market-body{padding:0 18px 18px}.biz-avatar{width:72px;height:72px;border-radius:22px;margin-top:-36px;position:relative;z-index:2;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#eef3ff);border:4px solid #fff;box-shadow:0 5px 0 #d2dcea,0 15px 25px rgba(20,44,80,.18);font-weight:950;font-size:24px;color:var(--accent);overflow:hidden}.biz-avatar img{width:100%;height:100%;object-fit:cover}.biz-tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.link-stack{display:grid;gap:9px;margin-top:15px}.link-stack .btn{width:100%;justify-content:center;text-align:center}.company-profile-shell{max-width:780px;margin:auto}.company-hero{height:178px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--cyan));position:relative;overflow:hidden;background-size:cover;background-position:center}.company-hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-55px;top:-75px;background:rgba(255,255,255,.12);box-shadow:-90px 65px 0 rgba(255,255,255,.05)}.company-profile-avatar{width:100px;height:100px;border-radius:29px;margin:-50px 0 0 22px;position:relative;z-index:3;display:grid;place-items:center;background:#fff;border:5px solid #fff;box-shadow:0 5px 0 #d2dcea,0 18px 32px rgba(18,39,71,.22);font-size:34px;font-weight:950;color:var(--accent);overflow:hidden}.company-profile-avatar img{width:100%;height:100%;object-fit:cover}.profile-preview{padding:0!important;overflow:hidden}.profile-preview .company-hero{border-radius:20px 20px 0 0;height:128px}.profile-preview .company-profile-avatar{width:80px;height:80px;border-radius:23px;margin-top:-40px;font-size:28px}.profile-preview-body{padding:0 18px 18px}.company-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.company-fact{padding:10px 12px;border-radius:12px;background:#f7f9fc;border:1px solid #e1e8f1;font-size:12px}.gallery-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.gallery-strip img{width:100%;height:100px;object-fit:cover;border-radius:13px;border:1px solid #dbe4ef}
.privacy-banner{background:linear-gradient(145deg,#effaf6,#e4f7ef);border:1px solid #bfe8d7;box-shadow:0 3px 0 #badfce;color:#176246}.job-market-card{padding:0!important;overflow:hidden}.job-topline{padding:12px 16px;background:linear-gradient(180deg,#fbfcff,#f1f5fb);border-bottom:1px solid #e1e8f1;display:flex;gap:8px;align-items:center}.job-image{height:150px;background:#e8eef6 center/cover no-repeat;border-bottom:1px solid #dce5ef}.job-body{padding:17px}.job-meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.job-footer{padding:13px 17px;border-top:1px solid #e7edf4;background:#fbfcfe;display:flex;align-items:center;gap:9px}.identity-dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#edf1ff,#dce4ff);border:1px solid #cad4fb;font-weight:950;color:#5253c5}.private-chip{background:#e9f7ff;border-color:#c7e6f5;color:#23627e;box-shadow:0 2px 0 #bcdceb}.quick-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.role-login{padding:14px;border-radius:16px;border:1px solid #d9e2ef;background:linear-gradient(145deg,#fff,#f5f8fc);box-shadow:0 3px 0 #d7e0eb;cursor:pointer;transition:.15s}.role-login:hover{transform:translateY(-2px)}.upload-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.upload-preview img{width:88px;height:70px;object-fit:cover;border-radius:12px;border:1px solid #dbe4ef}.option-note{padding:10px 12px;border-radius:12px;background:#f7f8ff;border:1px solid #dfe2ff;font-size:12px;color:#566176}
@media(max-width:900px){.color-row{grid-template-columns:1fr 1fr 1fr}.company-facts{grid-template-columns:1fr}.gallery-strip{grid-template-columns:1fr 1fr}.market-cover{height:82px}.company-hero{height:135px}}
@media(max-width:620px){.color-row{grid-template-columns:1fr 1fr}.quick-roles{grid-template-columns:1fr}.gallery-strip{grid-template-columns:1fr 1fr}.company-profile-avatar{width:84px;height:84px;margin-top:-42px}}

img.logo{width:112px;height:84px;object-fit:contain;background:#fff;border:0;border-radius:8px;box-shadow:none;display:block;flex-shrink:0}
.auth img.logo{width:200px;height:150px;margin:0 auto 16px}.sidebar .brand img.logo{width:160px;height:120px;margin:0 0 10px}
@media(max-width:650px){.public-head img.logo{width:80px;height:60px}.auth img.logo{width:160px;height:120px}}
</style><link rel="icon" type="image/png" href="/brand-logo.png"></head><body><div id="app"></div>
<script>
const S={token:localStorage.getItem('df_token')||'',user:null,state:null,public:null,view:'dashboard',setupToken:sessionStorage.getItem('df_setup')||'',route:location.pathname};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method,payload={}){let r=await fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,payload,token:S.token})});let j=await r.json();if(!j.ok)throw new Error(j.error||'Request failed');return j.data}
function toast(msg,ok=true){let d=document.createElement('div');d.className='toast '+(ok?'okt':'badt');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
async function init(){let b=await api('bootstrap');S.public=b.public; if(location.pathname.startsWith('/invite')) return renderInvite(); if(location.pathname==='/admin'||new URLSearchParams(location.search).get('mode')==='admin') return adminEntry(b); return renderPublic();}
async function adminEntry(b){if(S.token){try{let ss=await api('session_state');S.user=ss.user;if(['client','business'].includes(S.user.role)){S.state=await api('portal_state');return renderPortal()}S.state=await api('admin_state');return renderAdmin()}catch(e){localStorage.removeItem('df_token');S.token=''}} if(!b.owner_exists){return S.setupToken?renderOwnerCreate():renderDevGate()} return renderLogin()}
function renderDevGate(){document.title='Developer Access — Soumission.VIP';$('#app').innerHTML=`<div class="auth-wrap"><div class="auth card"><img class="logo" src="/brand-logo.png" alt="Soumission.VIP"><h1>Developer access</h1><p class="muted">Enter the foundation password to initialize the owner account.</p><div class="field"><label>Developer password</label><input id="devpass" type="password" autofocus></div><br><button class="btn primary" onclick="devUnlock()">Continue</button><p class="small muted">Use the setup password chosen when you deployed this service.</p></div></div>`}
async function devUnlock(){try{let r=await api('dev_unlock',{password:$('#devpass').value});S.setupToken=r.setup_token;sessionStorage.setItem('df_setup',S.setupToken);renderOwnerCreate()}catch(e){toast(e.message,false)}}
function renderOwnerCreate(){ $('#app').innerHTML=`<div class="auth-wrap"><div class="auth card"><img class="logo" src="/brand-logo.png" alt="Soumission.VIP"><h1>Create owner account</h1><p class="muted">This account controls the directory, staff access, listings, clients, jobs, monetization and maintenance.</p><div class="grid g2"><div class="field"><label>Username</label><input id="ou"></div><div class="field"><label>Password</label><input id="op" type="password"></div></div><br><button class="btn primary" onclick="createOwner()">Create owner & continue</button></div></div>`}
async function createOwner(){try{let r=await api('create_owner',{setup_token:S.setupToken,username:$('#ou').value,password:$('#op').value});S.token=r.token;localStorage.setItem('df_token',S.token);S.state=await api('admin_state');S.user=S.state.user;renderOnboardingTree()}catch(e){toast(e.message,false)}}
function renderLogin(){ $('#app').innerHTML=`<div class="auth-wrap"><div class="auth card"><img class="logo" src="/brand-logo.png" alt="Soumission.VIP"><h1>Owner / staff login</h1><div class="grid g2"><div class="field"><label>Username</label><input id="lu"></div><div class="field"><label>Password</label><input id="lp" type="password"></div></div><br><div class="toolbar"><button class="btn primary" onclick="login()">Log in</button></div><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><button class="btn ghost" onclick="location.href='/'">Open public directory</button></div></div>`}
async function login(){try{let r=await api('login',{username:$('#lu').value,password:$('#lp').value});S.token=r.token;localStorage.setItem('df_token',S.token);S.user=r.user;if(['client','business'].includes(S.user.role)){S.state=await api('portal_state');return renderPortal()}S.state=await api('admin_state');if(!S.state.config.onboarding_complete&&S.user.role==='owner')renderOnboardingTree();else renderAdmin()}catch(e){toast(e.message,false)}}
async function demoLogin(){try{let r=await api('login',{username:'demo',password:'admin'});S.token=r.token;localStorage.setItem('df_token',S.token);S.state=await api('admin_state');S.user=S.state.user;renderAdmin()}catch(e){toast(e.message,false)}}
function renderOnboardingTree(){let t=S.state.tree;$('#app').innerHTML=`<div class="auth-wrap" style="display:block"><div style="max-width:1050px;margin:30px auto" class="card"><span class="pill">Step 3 of 4</span><h1>Edit the service tree</h1><p class="muted">Rename roots, main categories and service branches now. You can edit them again from the dashboard.</p>${treeEditor(t)}<div class="toolbar" style="margin-top:18px"><span class="spacer"></span><button class="btn primary" onclick="saveOnboardingTree()">Save & continue</button></div></div></div>`}
async function saveOnboardingTree(){collectTreeInputs();try{await api('save_tree',{tree:S.state.tree});renderOnboardingBrand()}catch(e){toast(e.message,false)}}
function renderOnboardingBrand(){let c=S.state.config;$('#app').innerHTML=`<div class="auth-wrap"><div class="auth card" style="width:min(760px,94vw)"><span class="pill">Step 4 of 4</span><h1>Brand your directory</h1><div class="grid g2"><div class="field"><label>Directory name</label><input id="dn" value="${esc(c.directory_name)}"></div><div class="field"><label>Slogan</label><input id="sl" value="${esc(c.slogan)}"></div></div><div class="field" style="margin-top:14px"><label>Logo image</label><input id="logo" type="file" accept="image/*"></div><br><button class="btn primary" onclick="finishOnboarding()">Save & open owner dashboard</button></div></div>`}
async function finishOnboarding(){try{let logo=S.state.config.logo_data_url||'';let f=$('#logo').files[0];if(f)logo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});await api('save_branding',{directory_name:$('#dn').value,slogan:$('#sl').value,logo_data_url:logo});await api('finish_onboarding');S.state=await api('admin_state');renderAdmin()}catch(e){toast(e.message,false)}}
const NAV=[['dashboard','Quest HQ'],['tree','Service Tree'],['branding','Branding'],['businesses','Businesses'],['clients','Clients'],['jobs','Jobs & Quotes'],['invites','Invites'],['employees','Employees'],['growth','Growth Lab'],['monetization','Monetization'],['maintenance','Maintenance']];
function can(tab){return S.user.role!=='employee'||(S.user.permissions||[]).includes(tab)}
function renderAdmin(){let c=S.state.config,m=S.state.metrics||{},score=ownerScore();document.title=(c.directory_name||'Soumission.VIP')+' — Owner';let nav=NAV.filter(x=>can(x[0])).map(([id,n])=>`<button class="navbtn ${S.view===id?'active':''}" onclick="go('${id}')">${navIcon(id)} ${n}</button>`).join('');let lvl=Math.max(1,Math.ceil(score/20));$('#app').innerHTML=`<div class="admin"><aside class="sidebar"><div class="brand"><img class="logo" src="/brand-logo.png" alt="Soumission.VIP">${esc(c.directory_name||'Soumission.VIP')}</div><div class="sidebar-profile"><div class="toolbar"><div class="level-orb" style="width:42px;height:42px;border-radius:13px;font-size:15px">${lvl}</div><div><div class="small" style="color:#92a4bd">OWNER LEVEL</div><b style="color:#fff">${score}% launch power</b></div></div><div class="xpbar" style="margin-top:10px;background:#172942;border-color:#263c5a"><i style="width:${score}%"></i></div></div>${nav}<div style="margin-top:18px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)"><button class="navbtn" onclick="openPublic()">↗ View public site</button><button class="navbtn" onclick="logout()">⇥ Log out</button></div></aside><main class="content"><div class="topbar"><div><div class="top-title">${esc(NAV.find(x=>x[0]===S.view)?.[1]||'Quest HQ')}</div><div class="top-sub">${esc(S.user.username)} · ${esc(S.user.role)} · Foundation ${esc(c.version||'')}</div></div><div class="toolbar"><button class="btn ghost" onclick="refreshApp()">↻ Apply Patch</button><button class="btn dark" onclick="extractApp()">Extract ZIP</button></div></div><div id="page" class="page"></div></main></div>`;renderPage()}
function go(v){S.view=v;renderAdmin()} function openPublic(){window.open('/','_blank')}
async function logout(){await api('logout');localStorage.removeItem('df_token');S.token='';location.href='/admin'}
function renderPage(){let f={dashboard:pageDashboard,tree:pageTree,branding:pageBranding,businesses:pageBusinesses,clients:pageClients,jobs:pageJobs,invites:pageInvites,employees:pageEmployees,growth:pageGrowth,monetization:pageMonetization,maintenance:pageMaintenance}[S.view]||pageDashboard;f()}
function navIcon(id){return ({dashboard:'◆',tree:'⌘',branding:'✦',businesses:'▣',clients:'◉',jobs:'⇄',invites:'↗',employees:'♟',growth:'▲',monetization:'$',maintenance:'⚙'})[id]||'•'}
function ownerScore(){let m=S.state.metrics||{},c=S.state.config||{},g=c.growth||{};let pts=0;if(c.onboarding_complete)pts+=15;if((c.directory_name||'').length>3)pts+=10;if((c.slogan||'').length>8)pts+=10;if((m.businesses||0)>=3)pts+=15;if((m.clients||0)>=1)pts+=8;if((S.state.invites||[]).length>=1)pts+=8;if((m.jobs||0)>=1)pts+=8;if(g.positioning?.one_liner)pts+=10;if(g.offer?.primary_cta)pts+=6;if((m.leads||0)>=1)pts+=5;let mon=c.monetization||{};if(mon.business_listing?.enabled||mon.client_fees?.job_fee_enabled||mon.ads?.mode!=='off')pts+=5;return Math.min(100,pts)}
function pageDashboard(){let m=S.state.metrics||{},c=S.state.config||{},score=ownerScore(),lvl=Math.max(1,Math.ceil(score/20));let quests=[
['Brand locked',!!(c.directory_name&&c.slogan),'branding','Set a clear name and one memorable promise.','+100 XP'],
['Supply seeded',(m.businesses||0)>=3,'businesses','Add at least 3 relevant companies so the marketplace has real choice.','+180 XP'],
['Demand signal',(m.jobs||0)>=1,'jobs','Get the first homeowner project into the board.','+220 XP'],
['Lead engine live',(m.leads||0)>=1,'growth','Capture the first lead through the free project checklist.','+250 XP'],
['Revenue rule chosen',!!(c.monetization?.business_listing?.enabled||c.monetization?.client_fees?.job_fee_enabled||c.monetization?.ads?.mode!=='off'),'monetization','Pick a monetization path before piling on more features.','+300 XP']
];$('#page').innerHTML=`<div class="card quest-card" style="margin-bottom:20px"><div class="toolbar"><div class="level-orb">${lvl}</div><div style="min-width:220px;flex:1"><div class="quest-kicker">Founder Campaign</div><h1 style="margin:3px 0 7px">Launch power: ${score}%</h1><div class="xpbar"><i style="width:${score}%"></i></div><div class="xptext"><span>Foundation</span><span>${score}/100 XP</span></div></div><div class="reward-chip">Next unlock: real marketplace momentum</div></div></div><div class="grid g4">${[['Businesses',m.businesses||0],['Clients',m.clients||0],['Open/total jobs',m.jobs||0],['Captured leads',m.leads||0]].map(([k,v])=>`<div class="card metric-card"><div class="metric-label">${esc(k)}</div><div class="metric">${v}</div><div class="small muted">Live filesystem state</div></div>`).join('')}</div><div class="grid g2" style="margin-top:20px"><div class="card quest-card"><div class="quest-kicker">Active Quests</div><h2 class="quest-title">Do the work that changes the scoreboard</h2>${quests.map((q,i)=>`<div class="quest-row"><div class="quest-icon ${q[1]?'done':''}">${q[1]?'✓':i+1}</div><div><b>${q[0]}</b><div class="small muted">${q[3]}</div></div>${q[1]?`<span class="pill good">Complete</span>`:`<button class="btn" onclick="go('${q[2]}')">Start · ${q[4]}</button>`}</div>`).join('')}</div><div class="card quest-card"><div class="quest-kicker">System Loop</div><h2 class="quest-title">Build → patch → ship → learn</h2><div class="quest-row"><div class="quest-icon done">1</div><div><b>Operate from the dashboard</b><div class="small muted">JSON is persistent state; TXT is runtime and renovation flow.</div></div><span class="pill good">Core</span></div><div class="quest-row"><div class="quest-icon">2</div><div><b>Apply renovation scripts</b><div class="small muted">Drop Python-in-TXT into Patch or Renovation and create a snapshot before change.</div></div><button class="btn" onclick="go('maintenance')">Open</button></div><div class="quest-row"><div class="quest-icon">3</div><div><b>Extract the running build</b><div class="small muted">Turn the current version into the next GitHub/Render-ready ZIP.</div></div><button class="btn dark" onclick="extractApp()">Ship</button></div></div></div>`}
function treeEditor(t){let roots=(t.specialty_roots||[]).map((n,i)=>`<div class="tree-row"><span class="pill">Root ${esc(n.code)}</span><input data-tree="root" data-i="${i}" value="${esc(n.name)}"><span class="small muted">${(n.marketing_angles||[]).length} angles</span></div>`).join('');let cats=(t.categories||[]).map((n,i)=>`<div class="tree-row"><span class="pill">Category ${esc(n.code)}</span><input data-tree="cat" data-i="${i}" value="${esc(n.name)}"><span class="small muted">${(n.children||[]).length} services</span></div>${(n.children||[]).map((ch,j)=>`<div class="tree-row tree-child"><span class="small">${esc(ch.code)}</span><input data-tree="child" data-i="${i}" data-j="${j}" value="${esc(ch.name)}"><span class="angle">${(ch.marketing_angles||[]).length} angles</span></div>`).join('')}`).join('');return `<div class="card"><h3>Specialty roots</h3>${roots}<h3 style="margin-top:24px">Main categories + services</h3>${cats}</div>`}
function collectTreeInputs(){document.querySelectorAll('[data-tree]').forEach(el=>{let a=el.dataset.tree,i=+el.dataset.i,j=+el.dataset.j;if(a==='root')S.state.tree.specialty_roots[i].name=el.value;if(a==='cat')S.state.tree.categories[i].name=el.value;if(a==='child')S.state.tree.categories[i].children[j].name=el.value})}
function pageTree(){$('#page').innerHTML=`<div class="toolbar"><p class="muted">Edit any root, category or service name.</p><span class="spacer"></span><button class="btn primary" onclick="saveTree()">Save tree</button></div>${treeEditor(S.state.tree)}`}
async function saveTree(){collectTreeInputs();try{await api('save_tree',{tree:S.state.tree});toast('Service tree saved.')}catch(e){toast(e.message,false)}}
function pageBranding(){let c=S.state.config;$('#page').innerHTML=`<div class="card"><h2>Directory identity</h2><div class="grid g2"><div class="field"><label>Directory name</label><input id="bdn" value="${esc(c.directory_name)}"></div><div class="field"><label>Slogan</label><input id="bsl" value="${esc(c.slogan)}"></div><div class="field"><label>Public base URL</label><input id="burl" value="${esc(c.public_base_url||'')}"></div><div class="field"><label>Country</label><input id="bcountry" value="${esc(c.country||'Canada')}"></div></div><div class="field" style="margin-top:14px"><label>Logo</label><input id="blogo" type="file" accept="image/*"></div><br><button class="btn primary" onclick="saveBrand()">Save branding</button></div>`}
async function saveBrand(){try{let logo=S.state.config.logo_data_url||'',f=$('#blogo').files[0];if(f)logo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});await api('save_branding',{directory_name:$('#bdn').value,slogan:$('#bsl').value,logo_data_url:logo,public_base_url:$('#burl').value,country:$('#bcountry').value});S.state=await api('admin_state');renderAdmin();toast('Branding saved.')}catch(e){toast(e.message,false)}}
function rowsTable(rows,cols,removeFn){return `<table class="table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]]||'')}</td>`).join('')}<td>${S.user.role==='demo'?'':`<button class="btn danger" onclick="${removeFn}('${r.id}')">Remove</button>`}</td></tr>`).join('')}</tbody></table>`}
function pageBusinesses(){$('#page').innerHTML=`<div class="card"><div class="toolbar"><h2>Business listings</h2><span class="spacer"></span><button class="btn primary" onclick="showBizForm()">Add business</button></div>${rowsTable(S.state.businesses,[['name','Company'],['category','Category'],['city','City'],['phone','Phone']],'removeBiz')}</div>`}
function showBizForm(){modal(`<h2>Add business</h2><div class="grid g2"><div class="field"><label>Company name</label><input id="xname"></div><div class="field"><label>Category</label><input id="xcat"></div><div class="field"><label>City</label><input id="xcity"></div><div class="field"><label>Phone</label><input id="xphone"></div></div><br><button class="btn primary" onclick="createBiz()">Create listing</button>`)}
async function createBiz(){try{await api('create_business',{name:$('#xname').value,category:$('#xcat').value,city:$('#xcity').value,phone:$('#xphone').value,active:true});closeModal();await reload();toast('Business created.')}catch(e){toast(e.message,false)}} async function removeBiz(id){if(confirm('Remove this business?')){await api('remove_business',{id});await reload()}}
function pageClients(){$('#page').innerHTML=`<div class="card"><div class="toolbar"><h2>Clients / homeowners</h2><span class="spacer"></span><button class="btn primary" onclick="showClientForm()">Add client</button></div>${rowsTable(S.state.clients,[['name','Name'],['email','Email'],['phone','Phone'],['city','City']],'removeClient')}</div>`}
function showClientForm(){modal(`<h2>Add client</h2><div class="grid g2"><div class="field"><label>Name</label><input id="cname"></div><div class="field"><label>Email</label><input id="cemail"></div><div class="field"><label>Phone</label><input id="cphone"></div><div class="field"><label>City</label><input id="ccity"></div></div><br><button class="btn primary" onclick="createClient()">Create client</button>`)} async function createClient(){await api('create_client',{name:$('#cname').value,email:$('#cemail').value,phone:$('#cphone').value,city:$('#ccity').value});closeModal();await reload()} async function removeClient(id){if(confirm('Remove client?')){await api('remove_client',{id});await reload()}}
function pageJobs(){let jobs=S.state.jobs,qs=S.state.quotes;$('#page').innerHTML=`<div class="grid g2"><div class="card"><h2>Jobs</h2>${rowsTable(jobs,[['title','Job'],['category','Category'],['city','City'],['status','Status']],'removeJob')}</div><div class="card"><h2>Quotes</h2><table class="table"><tr><th>Job</th><th>Business</th><th>Amount</th><th>Status</th></tr>${qs.map(q=>`<tr><td>${esc(q.job_id)}</td><td>${esc(q.business_name||q.created_by_user_id)}</td><td>${esc(q.amount||'')}</td><td>${esc(q.status)}</td></tr>`).join('')}</table></div></div>`} async function removeJob(id){if(confirm('Remove job?')){await api('remove_job',{id});await reload()}}
function pageInvites(){$('#page').innerHTML=`<div class="card"><div class="toolbar"><h2>Custom invite links</h2><span class="spacer"></span><button class="btn primary" onclick="showInviteForm()">Create invite</button></div><table class="table"><tr><th>Name</th><th>Type</th><th>Status</th><th>Link</th></tr>${S.state.invites.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${esc(x.status)}</td><td><input style="width:100%" value="${esc(x.url)}" readonly onclick="this.select()"></td></tr>`).join('')}</table></div>`}
function showInviteForm(){modal(`<h2>Create invite</h2><div class="field"><label>Name</label><input id="iname"></div><div class="field"><label>Account type</label><select id="itype"><option value="business">Business</option><option value="client">Client / homeowner</option></select></div><br><button class="btn primary" onclick="createInvite()">Create link</button>`)} async function createInvite(){let x=await api('create_invite',{name:$('#iname').value,type:$('#itype').value,base_url:location.origin});closeModal();await reload();navigator.clipboard?.writeText(x.url);toast('Invite created and copied when clipboard permission is available.')}
function pageEmployees(){let tabs=NAV.map(x=>x[0]);$('#page').innerHTML=`<div class="card"><div class="toolbar"><h2>Employees & tab permissions</h2><span class="spacer"></span><button class="btn primary" onclick="showEmpForm()">Add employee</button></div>${rowsTable(S.state.employees,[['username','Username'],['permissions','Tab access'],['active','Active']],'removeEmp')}</div>`}
function showEmpForm(){modal(`<h2>Add employee</h2><div class="grid g2"><div class="field"><label>Username</label><input id="euser"></div><div class="field"><label>Password</label><input id="epass" type="password"></div></div><h4>Allowed tabs</h4><div class="grid g2">${NAV.map(([id,n])=>`<label><input type="checkbox" name="perm" value="${id}" ${id==='dashboard'?'checked':''}> ${n}</label>`).join('')}</div><br><button class="btn primary" onclick="createEmp()">Create employee</button>`)} async function createEmp(){let perms=[...document.querySelectorAll('[name=perm]:checked')].map(x=>x.value);await api('create_employee',{username:$('#euser').value,password:$('#epass').value,permissions:perms});closeModal();await reload()} async function removeEmp(id){if(confirm('Remove employee?')){await api('remove_employee',{id});await reload()}}
function pageGrowth(){let g=S.state.config.growth||{},p=g.positioning||{},o=g.offer||{},l=g.lead_engine||{},pr=g.proof||{},a=S.state.analytics||{},leads=S.state.leads||[];let breakdown=a.event_breakdown||{};$('#page').innerHTML=`<div class="card quest-card" style="margin-bottom:20px"><div class="quest-kicker">Growth Lab</div><h1 style="margin:4px 0 8px">Make the market understand the value faster.</h1><p class="muted" style="max-width:850px">This control room turns positioning, offer design and lead generation into editable system rules. Keep one category, one dominant promise and one primary action per surface; use proof and real urgency instead of hype.</p></div><div class="grid g2"><div class="card"><h2>Positioning quest</h2><div class="field"><label>Category you want to own in the customer's mind</label><input id="gcat" value="${esc(p.category_name||'')}"></div><div class="field"><label>One-line promise</label><textarea id="gone" rows="3">${esc(p.one_liner||'')}</textarea></div><div class="field"><label>The painful alternative / enemy</label><textarea id="genemy" rows="3">${esc(p.enemy||'')}</textarea></div><div class="field"><label>Candor statement</label><textarea id="gcandor" rows="3">${esc(p.candor||'')}</textarea></div></div><div class="card offer-panel"><h2>Offer forge</h2><div class="field"><label>Main headline</label><textarea id="ghead" rows="2">${esc(o.headline||'')}</textarea></div><div class="field"><label>Subheadline</label><input id="gsub" value="${esc(o.subheadline||'')}"></div><div class="grid g2"><div class="field"><label>Primary CTA</label><input id="gcta" value="${esc(o.primary_cta||'')}"></div><div class="field"><label>Secondary CTA</label><input id="gcta2" value="${esc(o.secondary_cta||'')}"></div></div><div class="field"><label>Value anchor</label><textarea id="ganchor" rows="2">${esc(o.price_anchor_text||'')}</textarea></div><div class="field"><label>Honest risk reversal / guarantee language</label><textarea id="gguarantee" rows="2">${esc(o.guarantee_text||'')}</textarea></div><div class="field"><label>Real urgency / timing language</label><textarea id="gurgency" rows="2">${esc(o.urgency_text||'')}</textarea></div><div class="field"><label>Bonuses / value stack — one per line</label><textarea id="gbonus" rows="4">${esc((o.bonuses||[]).join('\n'))}</textarea></div></div><div class="card lead-card"><h2>Lead engine</h2><div class="field"><label>Lead magnet title</label><input id="glmt" value="${esc(l.lead_magnet_title||'')}"></div><div class="field"><label>Lead magnet promise</label><input id="glms" value="${esc(l.lead_magnet_subtitle||'')}"></div><div class="field"><label>Referral prompt</label><textarea id="gref" rows="3">${esc(l.referral_prompt||'')}</textarea></div><div class="field"><label>Acquisition channels — one per line</label><textarea id="gchannels" rows="5">${esc((l.channels||[]).join('\n'))}</textarea></div></div><div class="card"><h2>Proof without fabrication</h2><div class="field"><label>Proof points — one per line</label><textarea id="gproof" rows="5">${esc((pr.proof_points||[]).join('\n'))}</textarea></div><div class="grid g2"><div class="field"><label>Featured stat value</label><input id="gstatv" value="${esc(pr.featured_stat_value||'')}"></div><div class="field"><label>Featured stat label</label><input id="gstatl" value="${esc(pr.featured_stat_label||'')}"></div></div><br><button class="btn primary big" onclick="saveGrowth()">Save Growth System</button></div></div><div class="grid g2" style="margin-top:20px"><div class="card"><div class="toolbar"><h2>Captured leads</h2><span class="pill gold">${leads.length} total</span></div>${leads.length?`<div class="table-wrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Source</th><th>Captured</th></tr>${leads.slice().reverse().slice(0,50).map(x=>`<tr><td>${esc(x.name||'')}</td><td>${esc(x.email||'')}</td><td>${esc(x.source||'')}</td><td>${esc(x.created_at||'')}</td></tr>`).join('')}</table></div>`:'<p class="muted">No leads captured yet. The public free-checklist quest feeds this table.</p>'}</div><div class="card"><h2>Conversion signals</h2>${Object.keys(breakdown).length?Object.entries(breakdown).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="quest-row"><div class="quest-icon">${v}</div><div><b>${esc(k.replaceAll('_',' '))}</b><div class="small muted">Tracked public interaction</div></div></div>`).join(''):'<p class="muted">No conversion events yet.</p>'}<p class="small muted">Use these signals to decide what to improve. Do not optimize vanity metrics before the core marketplace loop works.</p></div></div>`}
async function saveGrowth(){let lines=id=>($(id).value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);let growth={positioning:{category_name:$('#gcat').value,one_liner:$('#gone').value,enemy:$('#genemy').value,candor:$('#gcandor').value},offer:{headline:$('#ghead').value,subheadline:$('#gsub').value,primary_cta:$('#gcta').value,secondary_cta:$('#gcta2').value,price_anchor_text:$('#ganchor').value,guarantee_text:$('#gguarantee').value,urgency_text:$('#gurgency').value,bonuses:lines('#gbonus')},lead_engine:{lead_magnet_title:$('#glmt').value,lead_magnet_subtitle:$('#glms').value,referral_prompt:$('#gref').value,channels:lines('#gchannels')},proof:{proof_points:lines('#gproof'),featured_stat_value:$('#gstatv').value,featured_stat_label:$('#gstatl').value}};try{await api('save_growth',{growth});S.state=await api('admin_state');renderAdmin();toast('Growth system saved.')}catch(e){toast(e.message,false)}}
function pageMonetization(){let m=S.state.config.monetization||{},a=m.ads||{},b=m.business_listing||{},c=m.client_fees||{},p=m.payments||{};$('#page').innerHTML=`<div class="grid g2"><div class="card"><h2>1. Advertising</h2><div class="field"><label>Ad mode</label><select id="admode"><option ${a.mode==='off'?'selected':''}>off</option><option value="adsense" ${a.mode==='adsense'?'selected':''}>adsense</option><option value="custom" ${a.mode==='custom'?'selected':''}>custom</option></select></div><div class="field"><label>AdSense client</label><input id="adc" value="${esc(a.adsense_client||'')}"></div><div class="field"><label>AdSense slot</label><input id="ads" value="${esc(a.adsense_slot||'')}"></div><div class="field"><label>Custom banner text</label><input id="adt" value="${esc(a.custom_banner_text||'')}"></div><div class="field"><label>Custom banner target URL</label><input id="adu" value="${esc(a.custom_banner_url||'')}"></div><div class="field"><label>Custom banner image URL</label><input id="adi" value="${esc(a.custom_banner_image||'')}"></div></div><div class="card"><h2>2. Company listing fees</h2><label><input id="blen" type="checkbox" ${b.enabled?'checked':''}> Charge businesses</label><div class="grid g2"><div class="field"><label>Billing cycle</label><select id="blcy">${['daily','weekly','monthly','quarterly','annually'].map(x=>`<option ${b.cycle===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Amount (CAD)</label><input id="blam" type="number" step="0.01" value="${(b.amount_cents||0)/100}"></div></div></div><div class="card"><h2>3. Client fees</h2><label><input id="cae" type="checkbox" ${c.account_fee_enabled?'checked':''}> Charge account creation</label><div class="field"><label>Account fee (CAD)</label><input id="caa" type="number" step="0.01" value="${(c.account_fee_cents||0)/100}"></div><label><input id="cje" type="checkbox" ${c.job_fee_enabled?'checked':''}> Charge per job posting</label><div class="field"><label>Job fee (CAD)</label><input id="cja" type="number" step="0.01" value="${(c.job_fee_cents||0)/100}"></div></div><div class="card"><h2>Payment processors</h2><label><input id="sten" type="checkbox" ${p.stripe_enabled?'checked':''}> Stripe</label><br><label><input id="ppen" type="checkbox" ${p.paypal_enabled?'checked':''}> PayPal</label><div class="field"><label>PayPal mode</label><select id="ppmode"><option ${p.paypal_mode==='sandbox'?'selected':''}>sandbox</option><option ${p.paypal_mode==='live'?'selected':''}>live</option></select></div><p class="small muted">Production secrets can come from Render environment variables; local secrets are stored outside deployable ZIPs.</p><button class="btn ghost" onclick="showSecretForm()">Configure local payment secrets</button></div></div><br><button class="btn primary" onclick="saveMonetization()">Save monetization</button>`}
async function saveMonetization(){let old=S.state.config.monetization||{};let monetization={ads:{...old.ads,mode:$('#admode').value,adsense_client:$('#adc').value,adsense_slot:$('#ads').value,custom_banner_text:$('#adt').value,custom_banner_url:$('#adu').value,custom_banner_image:$('#adi').value},business_listing:{enabled:$('#blen').checked,cycle:$('#blcy').value,amount_cents:Math.round(($('#blam').value||0)*100)},client_fees:{account_fee_enabled:$('#cae').checked,account_fee_cents:Math.round(($('#caa').value||0)*100),job_fee_enabled:$('#cje').checked,job_fee_cents:Math.round(($('#cja').value||0)*100)},payments:{stripe_enabled:$('#sten').checked,paypal_enabled:$('#ppen').checked,paypal_mode:$('#ppmode').value}};await api('save_monetization',{monetization});await reload();toast('Monetization settings saved.')}
function showSecretForm(){modal(`<h2>Local payment secrets</h2><p class="notice">These are stored in <code>data/private/payment_secrets.json</code> and excluded from deployable ZIPs. On Render, use environment variables instead.</p><div class="field"><label>Stripe secret key</label><input id="ssk" type="password"></div><div class="field"><label>PayPal client ID</label><input id="pci"></div><div class="field"><label>PayPal client secret</label><input id="pcs" type="password"></div><br><button class="btn primary" onclick="saveSecrets()">Save locally</button>`)} async function saveSecrets(){await api('save_payment_secrets',{STRIPE_SECRET_KEY:$('#ssk').value,PAYPAL_CLIENT_ID:$('#pci').value,PAYPAL_CLIENT_SECRET:$('#pcs').value});closeModal();toast('Local payment secrets saved.')}
function pageMaintenance(){$('#page').innerHTML=`<div class="grid g2"><div class="card"><h2>Patch workflow</h2><p>Drop a Python patch script as text into:</p><code>Renovation/patch.txt</code><p>or</p><code>Renovation/inbox/*.txt</code><p class="muted small">The Patch/ channel is also supported for compatibility.</p><p class="muted small">Refresh creates a pre-patch snapshot, runs the patch, and moves it to Patch/patched on success or Patch/failed on failure.</p><button class="btn primary" onclick="refreshApp()">Apply patches + refresh</button></div><div class="card"><h2>Extract workflow</h2><p>The extraction creates:</p><ul><li>Deployment-safe ZIP for GitHub/Render.</li><li>Full local backup ZIP excluding payment secrets.</li></ul><button class="btn dark" onclick="extractApp()">Create ZIPs</button></div><div class="card"><h2>Commit workflow</h2><p>Run <code>Commits/Launch_Commit_Tool.bat</code>. It asks for the latest online ZIP, compares it with the current deployable build, and writes a commit bundle into <code>Commits/commit/</code>.</p></div><div class="card"><h2>Render persistence</h2><p>Use <code>DATA_DIR</code> on a persistent disk. The provided render.yaml mounts <code>/var/data/directory-platform</code>.</p></div></div>`}
async function refreshApp(){try{let r=await api('refresh_app');let n=r.patches.length;toast(n?`Applied ${n} patch file(s). Reloading…`:'No patch files found. Reloading…');setTimeout(()=>location.reload(),600)}catch(e){toast(e.message,false)}}
async function extractApp(){try{let r=await api('extract_app');modal(`<h2>Extraction complete</h2><p><b>Deployable:</b><br><code>${esc(r.deployable_zip)}</code></p><p><b>Full backup:</b><br><code>${esc(r.backup_zip)}</code></p><p class="muted small">Both files are also in the app's exports folder.</p><button class="btn primary" onclick="closeModal()">Done</button>`)}catch(e){toast(e.message,false)}}
async function reload(){S.state=await api('admin_state');renderAdmin()}
function modal(html){let d=document.createElement('div');d.id='modal';d.className='modal';d.innerHTML=`<div class="box"><div class="toolbar"><span class="spacer"></span><button class="btn ghost" onclick="closeModal()">✕</button></div>${html}</div>`;document.body.appendChild(d)} function closeModal(){document.getElementById('modal')?.remove()}
function renderPortal(){let st=S.state,u=st.user,p=st.profile||{},pub=st.public||{},b=pub.branding||{};document.title=(b.directory_name||'Directory')+' — '+(u.role==='client'?'Client':'Business');let body=u.role==='client'?clientPortal(st):businessPortal(st),activity=u.role==='client'?(st.my_jobs?.length||0)+(st.quotes?.length||0):(st.open_jobs?.length||0)+(st.my_quotes?.length||0),lvl=Math.max(1,Math.min(9,1+Math.floor(activity/3))),profilePct=Math.round(([p.name,p.email,p.phone,p.city].filter(Boolean).length/4)*100);$('#app').innerHTML=`<div class="public-head"><div class="logo">${esc((b.directory_name||'D')[0])}</div><b>${esc(b.directory_name||'Directory')}</b><span class="pill">${esc(u.role)}</span><span class="spacer"></span><button class="btn ghost hide-mobile" onclick="location.href='/'">Public directory</button><button class="btn dark" onclick="logout()">Log out</button></div><main class="portal-main"><div class="card portal-hero quest-card"><div class="toolbar"><div class="portal-level"><div class="level-orb">${lvl}</div><div><div class="quest-kicker">${u.role==='client'?'Home Project Campaign':'Business Opportunity Campaign'}</div><h2 style="margin:3px 0">Welcome, ${esc(p.name||u.username)}</h2><div class="small muted">Profile power ${profilePct}% · ${esc(p.city||'Set your city to improve matching')}</div></div></div><span class="spacer"></span><button class="btn" onclick="showPortalProfile()">Upgrade profile</button></div><div class="xpbar" style="margin-top:14px"><i style="width:${profilePct}%"></i></div></div>${body}</main>`}
function clientPortal(st){let m=st.public.monetization||{},cf=m.client_fees||{};return `<div class="grid g2" style="margin-top:18px"><div class="card"><div class="toolbar"><h2>My jobs</h2><span class="spacer"></span><button class="btn primary" onclick="showPortalJob()">Post a job</button></div>${st.my_jobs.length?`<table class="table"><tr><th>Job</th><th>Category</th><th>Status</th><th>Direct company</th></tr>${st.my_jobs.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.category||'')}</td><td>${esc(x.status)}</td><td>${esc(x.direct_business_id||'Marketplace')}</td></tr>`).join('')}</table>`:'<p class="muted">No jobs posted yet.</p>'}</div><div class="card"><h2>Quotes received</h2>${st.quotes.length?`<table class="table"><tr><th>Business</th><th>Amount</th><th>Status</th></tr>${st.quotes.map(q=>`<tr><td>${esc(q.business_name||'Business')}</td><td>${esc(q.amount||'')}</td><td>${esc(q.status)}</td></tr>`).join('')}</table>`:'<p class="muted">No quotes received yet.</p>'}</div></div><div class="card" style="margin-top:18px"><div class="toolbar"><h2>Find companies</h2><span class="spacer"></span><input id="portalBizSearch" placeholder="Search company, category, city" oninput="filterPortalBusinesses(this.value)" style="max-width:320px;padding:9px;border:1px solid #d0d5dd;border-radius:9px"></div><div id="portalBizGrid" class="grid g3">${publicBusinesses(st.public.businesses||[])}</div></div>${(cf.account_fee_enabled||cf.job_fee_enabled)?`<div class="card" style="margin-top:18px"><h2>Billing</h2>${cf.account_fee_enabled?`<p>Account fee: $${((cf.account_fee_cents||0)/100).toFixed(2)} CAD ${payButtons('client_account',m)}</p>`:''}${cf.job_fee_enabled?`<p>Job posting fee: $${((cf.job_fee_cents||0)/100).toFixed(2)} CAD ${payButtons('client_job',m)}</p>`:''}</div>`:''}`}
function businessPortal(st){let m=st.public.monetization||{},bl=m.business_listing||{};return `<div class="grid g2" style="margin-top:18px"><div class="card"><div class="toolbar"><h2>Search open jobs</h2><span class="spacer"></span><input id="portalJobSearch" placeholder="Search job, category, city" oninput="filterPortalJobs(this.value)" style="max-width:300px;padding:9px;border:1px solid #d0d5dd;border-radius:9px"></div><div id="portalJobList">${portalJobCards(st.open_jobs||[])}</div></div><div class="card"><h2>My submitted quotes</h2>${st.my_quotes.length?`<table class="table"><tr><th>Job</th><th>Amount</th><th>Status</th></tr>${st.my_quotes.map(q=>`<tr><td>${esc(q.job_id)}</td><td>${esc(q.amount||'')}</td><td>${esc(q.status)}</td></tr>`).join('')}</table>`:'<p class="muted">No quotes submitted yet.</p>'}</div></div>${bl.enabled?`<div class="card" style="margin-top:18px"><h2>Listing billing</h2><p>$${((bl.amount_cents||0)/100).toFixed(2)} CAD · ${esc(bl.cycle||'monthly')} ${payButtons('business_listing',m)}</p></div>`:''}`}
function portalJobCards(rows){return rows.length?rows.map(j=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><span class="pill">${esc(j.category||'Project')}</span><b style="display:block;margin:7px 0">${esc(j.title||'Home project')}</b><div class="muted small">${esc(j.city||'')} · ${esc(j.timing||'')}</div><p>${esc(j.description||'')}</p><button class="btn primary" onclick="showQuoteForm('${j.id}')">Send quote</button></div>`).join(''):'<p class="muted">No open jobs right now.</p>'}
function filterPortalJobs(q){q=(q||'').toLowerCase();let rows=(S.state.open_jobs||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('#portalJobList').innerHTML=portalJobCards(rows)}
function filterPortalBusinesses(q){q=(q||'').toLowerCase();let rows=(S.state.public.businesses||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('#portalBizGrid').innerHTML=publicBusinesses(rows)}
function payButtons(kind,m){let p=m.payments||{},x='';if(p.stripe_enabled)x+=`<button class="btn" onclick="startPay('${kind}','stripe')">Pay with Stripe</button> `;if(p.paypal_enabled)x+=`<button class="btn" onclick="startPay('${kind}','paypal')">Pay with PayPal</button>`;return x||'<span class="muted small">Payment processor not enabled</span>'}
async function startPay(kind,provider){try{let r=await api('payment_checkout',{kind,provider,base_url:location.origin});if(r.checkout_url)location.href=r.checkout_url;else toast('Checkout URL was not returned.',false)}catch(e){toast(e.message,false)}}
function showPortalProfile(){let p=S.state.profile||{},business=S.state.user.role==='business';modal(`<h2>${business?'Company listing':'Client profile'}</h2><div class="grid g2"><div class="field"><label>Name</label><input id="pfname" value="${esc(p.name||'')}"></div><div class="field"><label>Email</label><input id="pfemail" value="${esc(p.email||'')}"></div><div class="field"><label>Phone</label><input id="pfphone" value="${esc(p.phone||'')}"></div><div class="field"><label>City</label><input id="pfcity" value="${esc(p.city||'')}"></div>${business?`<div class="field"><label>Category</label><input id="pfcat" value="${esc(p.category||'')}"></div><div class="field"><label>Website</label><input id="pfweb" value="${esc(p.website||'')}"></div>`:''}</div>${business?`<div class="field"><label>Description</label><textarea id="pfdesc" rows="5">${esc(p.description||'')}</textarea></div>`:''}<br><button class="btn primary" onclick="savePortalProfile()">Save</button>`)}
async function savePortalProfile(){let business=S.state.user.role==='business',payload={name:$('#pfname').value,email:$('#pfemail').value,phone:$('#pfphone').value,city:$('#pfcity').value};if(business){payload.category=$('#pfcat').value;payload.website=$('#pfweb').value;payload.description=$('#pfdesc').value;payload.active=true}try{await api('update_portal_profile',payload);closeModal();S.state=await api('portal_state');renderPortal();toast(business?'Company listing updated.':'Profile updated.')}catch(e){toast(e.message,false)}}

function safeUrl(u){try{let x=new URL(u||'#',location.origin);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch(e){return '#'}}

async function imageToDataUrl(file,maxDim=960,quality=.84){if(!file)return'';if(file.size>18*1024*1024)throw new Error(tr('Image is too large. Use a file under 18 MB.','Image trop lourde. Utilisez un fichier de moins de 18 Mo.'));let raw=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)}),img=await new Promise((res,rej)=>{let i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=raw}),scale=Math.min(1,maxDim/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/webp',quality)}
