renderLogin=function(){$('#app').innerHTML=`<div class="auth-wrap"><div class="auth card"><div class="toolbar"><img class="logo" src="/brand-logo.png" alt="Soumission.VIP"><span class="spacer"></span>${langToggle()}</div><h1>${tr('Choose your workspace','Choisissez votre espace')}</h1><p class="muted">${tr('Owner, staff, client and business accounts all use this secure entry.','Les comptes propriétaire, équipe, client et entreprise utilisent tous cet accès sécurisé.')}</p><div class="grid g2"><div class="field"><label>${tr('Username','Nom d’utilisateur')}</label><input id="lu"></div><div class="field"><label>${tr('Password','Mot de passe')}</label><input id="lp" type="password"></div></div><br><div class="toolbar"><button class="btn primary" onclick="login()">${tr('Log in','Connexion')}</button></div><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><button class="btn ghost" onclick="location.href='/'">${tr('Open public directory','Ouvrir le répertoire public')}</button></div></div>`}
function quickRoleLogin(user){$('#lu').value=user;$('#lp').value='admin';login()}

function treeEditor(t){let L=DF_LANG==='fr'?'name_fr':'name',roots=(t.specialty_roots||[]).map((n,i)=>`<div class="tree-row"><span class="pill">${tr('Root','Racine')} ${esc(n.code)}</span><input data-tree="root" data-i="${i}" value="${esc(n[L]||n.name||'')}"><span class="small muted">${(n.marketing_angles||[]).length} angles</span></div>`).join(''),cats=(t.categories||[]).map((n,i)=>`<div class="tree-row"><span class="pill">${tr('Category','Catégorie')} ${esc(n.code)}</span><input data-tree="cat" data-i="${i}" value="${esc(n[L]||n.name||'')}"><span class="small muted">${(n.children||[]).length} services</span></div>${(n.children||[]).map((ch,j)=>`<div class="tree-row tree-child"><span class="small">${esc(ch.code)}</span><input data-tree="child" data-i="${i}" data-j="${j}" value="${esc(ch[L]||ch.name||'')}"><span class="angle">${(ch.marketing_angles||[]).length} angles</span></div>`).join('')}`).join('');return `<div class="card"><div class="toolbar"><div><div class="quest-kicker">${tr('Bilingual service architecture','Architecture de services bilingue')}</div><h3>${tr('Specialty roots','Racines spécialisées')}</h3></div><span class="spacer"></span>${langToggle()}</div><p class="small muted">${tr('Switch EN/FR to edit that language. The 22-angle marketing data is preserved.','Passez de EN à FR pour modifier cette langue. Les données des 22 angles marketing sont préservées.')}</p>${roots}<h3 style="margin-top:24px">${tr('Main categories + services','Catégories principales + services')}</h3>${cats}</div>`}
function collectTreeInputs(){let L=DF_LANG==='fr'?'name_fr':'name';document.querySelectorAll('[data-tree]').forEach(el=>{let a=el.dataset.tree,i=+el.dataset.i,j=+el.dataset.j;if(a==='root')S.state.tree.specialty_roots[i][L]=el.value;if(a==='cat')S.state.tree.categories[i][L]=el.value;if(a==='child')S.state.tree.categories[i].children[j][L]=el.value})}
function pageTree(){$('#page').innerHTML=`<div class="toolbar"><p class="muted">${tr('Edit every root, category and service name in English or French.','Modifiez chaque racine, catégorie et service en anglais ou en français.')}</p><span class="spacer"></span><button class="btn primary" onclick="saveTree()">${tr('Save tree','Enregistrer l’arborescence')}</button></div>${treeEditor(S.state.tree)}`}

function pageBranding(){let c=S.state.config,t=c.brand_theme||{},logo=c.logo_data_url||'',langs=c.enabled_languages||['en','fr'];$('#page').innerHTML=`<div class="card"><div class="toolbar"><div><div class="quest-kicker">${tr('Brand control center','Centre de contrôle de marque')}</div><h2>${tr('Identity, language and colors','Identité, langue et couleurs')}</h2></div><span class="spacer"></span>${langToggle()}</div><div class="brand-preview" style="margin:14px 0 20px"><div id="brandLogoPreview" class="logo-lg">${logo?`<img src="${esc(logo)}">`:esc((c.directory_name||'D')[0])}</div><div><b style="font-size:22px">${esc(c.directory_name||'Directory')}</b><div class="muted">${esc(c.slogan||'')}</div></div></div><div class="grid g2"><div class="field"><label>${tr('Directory name','Nom du répertoire')}</label><input id="bdn" value="${esc(c.directory_name||'')}"></div><div class="field"><label>Slogan</label><input id="bsl" value="${esc(c.slogan||'')}"></div><div class="field"><label>${tr('Public base URL','URL publique')}</label><input id="burl" value="${esc(c.public_base_url||'')}"></div><div class="field"><label>${tr('Country','Pays')}</label><input id="bcountry" value="${esc(c.country||'Canada')}"></div><div class="field"><label>${tr('Default language','Langue par défaut')}</label><select id="bdefaultlang"><option value="en" ${c.default_language==='en'?'selected':''}>English</option><option value="fr" ${c.default_language==='fr'?'selected':''}>Français</option></select></div><div class="field"><label>${tr('Enabled languages','Langues activées')}</label><div class="toolbar"><label><input id="ben" type="checkbox" ${langs.includes('en')?'checked':''}> EN</label><label><input id="bfr" type="checkbox" ${langs.includes('fr')?'checked':''}> FR</label></div></div></div><div class="field" style="margin-top:14px"><label>${tr('Logo image','Logo')}</label><input id="blogo" type="file" accept="image/*" onchange="previewBrandLogo(this)"><span class="small muted">${tr('Large images are resized and compressed automatically before saving.','Les grandes images sont redimensionnées et compressées automatiquement avant l’enregistrement.')}</span></div><h3 style="margin-top:22px">${tr('Brand colors','Couleurs de marque')}</h3><div class="color-row"><div class="color-field"><label>${tr('Primary','Primaire')}</label><input id="cprimary" type="color" value="${esc(t.primary||'#5b5cf0')}"></div><div class="color-field"><label>${tr('Secondary','Secondaire')}</label><input id="csecondary" type="color" value="${esc(t.secondary||'#2d7ff9')}"></div><div class="color-field"><label>Accent</label><input id="caccent" type="color" value="${esc(t.accent||'#18b6d9')}"></div><div class="color-field"><label>${tr('Background','Arrière-plan')}</label><input id="cbg" type="color" value="${esc(t.background||'#eef3fb')}"></div><div class="color-field"><label>${tr('Surface','Surface')}</label><input id="csurface" type="color" value="${esc(t.surface||'#ffffff')}"></div><div class="color-field"><label>${tr('Text','Texte')}</label><input id="ctext" type="color" value="${esc(t.text||'#0b1424')}"></div></div><br><button class="btn primary" onclick="saveBrand()">${tr('Save branding','Enregistrer la marque')}</button></div>`}
async function previewBrandLogo(input){let f=input.files?.[0];if(!f)return;try{let d=await imageToDataUrl(f,640,.88);input.dataset.preview=d;$('#brandLogoPreview').innerHTML=`<img src="${d}">`}catch(e){toast(e.message,false)}}
async function saveBrand(){try{let logo=S.state.config.logo_data_url||'',f=$('#blogo').files?.[0];if(f)logo=$('#blogo').dataset.preview||await imageToDataUrl(f,640,.88);let langs=[];if($('#ben').checked)langs.push('en');if($('#bfr').checked)langs.push('fr');if(!langs.length)langs=['en'];await api('save_branding',{directory_name:$('#bdn').value,slogan:$('#bsl').value,logo_data_url:logo,public_base_url:$('#burl').value,country:$('#bcountry').value,default_language:$('#bdefaultlang').value,enabled_languages:langs,brand_theme:{primary:$('#cprimary').value,secondary:$('#csecondary').value,accent:$('#caccent').value,background:$('#cbg').value,surface:$('#csurface').value,text:$('#ctext').value}});S.state=await api('admin_state');applyBrandTheme(S.state);renderAdmin();toast(tr('Branding saved.','Marque enregistrée.'))}catch(e){toast(e.message,false)}}

function companyAvatar(x,cls='biz-avatar'){return `<div class="${cls}">${x.logo_data_url?`<img src="${esc(x.logo_data_url)}" alt="">`:esc((x.name||'B')[0])}</div>`}
function companyCover(x){let style=x.banner_data_url?`style="background-image:linear-gradient(rgba(30,40,90,.12),rgba(30,40,90,.12)),url('${esc(x.banner_data_url)}')"`:'';return `<div class="market-cover" ${style}></div>`}
function companyFacts(x){let items=[];if(x.service_area)items.push(['⌖',x.service_area]);if(x.years_in_business)items.push(['★',x.years_in_business+' '+tr('years / experience','ans / expérience')]);if(x.hours)items.push(['◷',x.hours]);if(x.license_info)items.push(['✓',x.license_info]);return items.length?`<div class="company-facts">${items.slice(0,4).map(a=>`<div class="company-fact"><b>${a[0]}</b> ${esc(a[1])}</div>`).join('')}</div>`:''}
function companyLinks(x){let links=[];if(x.website)links.push([tr('Visit website','Visiter le site'),safeUrl(x.website),'↗']);if(x.phone)links.push([tr('Call company','Appeler l’entreprise'),'tel:'+String(x.phone).replace(/[^0-9+]/g,''),'☎']);if(x.email)links.push([tr('Email company','Écrire à l’entreprise'),'mailto:'+x.email,'✉']);let socials=x.social_links||{};for(let [k,v] of Object.entries(socials)){if(v)links.push([k.charAt(0).toUpperCase()+k.slice(1),safeUrl(v),'◆'])}for(let l of (x.custom_links||[])){if(l?.url)links.push([l.label||tr('More information','Plus d’information'),safeUrl(l.url),'→'])}return links.map(a=>`<a class="btn" href="${esc(a[1])}" ${a[1].startsWith('http')?'target="_blank" rel="noopener"':''}>${a[2]} ${esc(a[0])}</a>`).join('')}
function companyProfileCard(x){let specs=Array.isArray(x.specialties)?x.specialties:[];return `<div class="card profile-preview">${companyCover(x)}<div class="company-profile-avatar">${x.logo_data_url?`<img src="${esc(x.logo_data_url)}">`:esc((x.name||'B')[0])}</div><div class="profile-preview-body"><div class="toolbar"><div><h2 style="margin:8px 0 2px">${esc(x.name||'Business')}</h2><div class="muted small">${esc(x.tagline||x.category||tr('General services','Services généraux'))} · ${esc(x.city||'Local')}</div></div><span class="spacer"></span><span class="pill good">${tr('Public listing','Fiche publique')}</span></div><div class="biz-tags">${specs.slice(0,5).map(z=>`<span class="pill">${esc(z)}</span>`).join('')}</div><p>${esc(x.description||tr('Complete your company story and direct contact options.','Complétez votre présentation et vos options de contact.'))}</p>${companyFacts(x)}<div class="link-stack">${companyLinks(x)}</div>${(x.gallery||[]).length?`<div class="gallery-strip">${x.gallery.slice(0,3).map(g=>`<img src="${esc(g)}" alt="">`).join('')}</div>`:''}</div></div>`}

function businessPortal(st){let m=st.public.monetization||{},bl=m.business_listing||{},p=st.profile||{};return `<div class="grid g2" style="margin-top:18px"><div>${companyProfileCard(p)}<div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="showPortalProfile()">${tr('Edit my public listing','Modifier ma fiche publique')}</button><button class="btn" onclick="openBusinessProfile('${esc(p.id||'')}')">${tr('Preview public profile','Aperçu public')}</button></div></div><div class="card quest-card"><div class="quest-kicker">${tr('BUSINESS COMMAND CENTER','CENTRE DE COMMANDE ENTREPRISE')}</div><h2>${tr('Turn profile strength into qualified opportunities.','Transformez votre fiche en occasions qualifiées.')}</h2><div class="quest-row"><div class="quest-icon done">1</div><div><b>${tr('Build a profile people can trust','Construire une fiche digne de confiance')}</b><div class="small muted">${tr('Logo, cover, specialties, credentials, service area and direct links.','Logo, couverture, spécialités, qualifications, zone de service et liens directs.')}</div></div></div><div class="quest-row"><div class="quest-icon">2</div><div><b>${tr('Search homeowner jobs','Chercher des projets clients')}</b><div class="small muted">${tr('Filter opportunities by problem, category and city.','Filtrez les occasions par besoin, catégorie et ville.')}</div></div></div><div class="quest-row"><div class="quest-icon">3</div><div><b>${tr('Send a scoped quote','Envoyer une soumission claire')}</b><div class="small muted">${tr('Compete on scope, timing and proof — not only price.','Comparez la portée, le délai et les preuves — pas seulement le prix.')}</div></div></div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="toolbar"><h2>${tr('Open homeowner jobs','Projets clients ouverts')}</h2><span class="spacer"></span><input id="portalJobSearch" placeholder="${tr('Search job, category, city','Rechercher projet, catégorie, ville')}" oninput="filterPortalJobs(this.value)" style="max-width:300px;padding:9px;border:1px solid #d0d5dd;border-radius:9px"></div><div id="portalJobList">${portalJobCards(st.open_jobs||[])}</div></div><div class="card"><h2>${tr('My submitted quotes','Mes soumissions envoyées')}</h2>${st.my_quotes.length?`<table class="table"><tr><th>${tr('Job','Projet')}</th><th>${tr('Amount','Montant')}</th><th>${tr('Status','Statut')}</th></tr>${st.my_quotes.map(q=>`<tr><td>${esc(q.job_id)}</td><td>${esc(q.amount||'')}</td><td>${esc(q.status)}</td></tr>`).join('')}</table>`:`<p class="muted">${tr('No quotes submitted yet.','Aucune soumission envoyée.')}</p>`}</div></div>${bl.enabled?`<div class="card" style="margin-top:18px"><h2>${tr('Listing billing','Facturation de la fiche')}</h2><p>$${((bl.amount_cents||0)/100).toFixed(2)} CAD · ${esc(bl.cycle||'monthly')} ${payButtons('business_listing',m)}</p></div>`:''}`}
function clientPortal(st){let m=st.public.monetization||{},cf=m.client_fees||{};return `<div class="privacy-banner card" style="margin-top:18px"><div class="toolbar"><div class="identity-dot">✓</div><div><b>${tr('Private by default','Privé par défaut')}</b><div class="small">${tr('Clients never receive a public profile. Only a job ad you publish becomes public; your private contact record stays inside the platform.','Les clients n’ont jamais de profil public. Seule une annonce de projet publiée devient publique; vos coordonnées privées restent dans la plateforme.')}</div></div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="toolbar"><h2>${tr('My project ads','Mes annonces de projets')}</h2><span class="spacer"></span><button class="btn primary" onclick="showPortalJob()">${tr('Post a job','Publier un projet')}</button></div>${st.my_jobs.length?`<div style="display:grid;gap:12px">${st.my_jobs.map(x=>`<div class="card job-market-card"><div class="job-topline"><span class="pill">${esc(x.category||tr('Project','Projet'))}</span><span class="spacer"></span><span class="pill private-chip">${esc(x.status||'open')}</span></div>${x.image_data_url?`<div class="job-image" style="background-image:url('${esc(x.image_data_url)}')"></div>`:''}<div class="job-body"><h3>${esc(x.title)}</h3><div class="job-meta"><span class="pill">⌖ ${esc(x.city||'')}</span><span class="pill">◷ ${esc(x.timing||tr('Flexible','Flexible'))}</span>${x.budget?`<span class="pill gold">$ ${esc(x.budget)}</span>`:''}${x.property_type?`<span class="pill">⌂ ${esc(x.property_type)}</span>`:''}</div><p>${esc(x.description||'')}</p></div></div>`).join('')}</div>`:`<p class="muted">${tr('No jobs posted yet.','Aucun projet publié.')}</p>`}</div><div class="card"><h2>${tr('Quotes received','Soumissions reçues')}</h2>${st.quotes.length?`<table class="table"><tr><th>${tr('Business','Entreprise')}</th><th>${tr('Amount','Montant')}</th><th>${tr('Status','Statut')}</th></tr>${st.quotes.map(q=>`<tr><td>${esc(q.business_name||'Business')}</td><td>${esc(q.amount||'')}</td><td>${esc(q.status)}</td></tr>`).join('')}</table>`:`<p class="muted">${tr('No quotes received yet.','Aucune soumission reçue.')}</p>`}</div></div><div class="card" style="margin-top:18px"><div class="toolbar"><h2>${tr('Find companies','Trouver des entreprises')}</h2><span class="spacer"></span><input id="portalBizSearch" placeholder="${tr('Search company, category, city','Rechercher entreprise, catégorie, ville')}" oninput="filterPortalBusinesses(this.value)" style="max-width:320px;padding:9px;border:1px solid #d0d5dd;border-radius:9px"></div><div id="portalBizGrid" class="grid g3">${publicBusinesses(st.public.businesses||[])}</div></div>${(cf.account_fee_enabled||cf.job_fee_enabled)?`<div class="card" style="margin-top:18px"><h2>${tr('Billing','Facturation')}</h2>${cf.account_fee_enabled?`<p>${tr('Account fee','Frais de compte')}: $${((cf.account_fee_cents||0)/100).toFixed(2)} CAD ${payButtons('client_account',m)}</p>`:''}${cf.job_fee_enabled?`<p>${tr('Job posting fee','Frais de publication')}: $${((cf.job_fee_cents||0)/100).toFixed(2)} CAD ${payButtons('client_job',m)}</p>`:''}</div>`:''}`}

function publicBusinesses(rows){return rows.length?rows.map(x=>`<div class="card market-card quest-card">${companyCover(x)}<div class="market-body">${companyAvatar(x)}<div class="toolbar" style="margin-top:9px"><div><h3 style="margin:0">${esc(x.name||'Business')}</h3><div class="muted small">${esc(x.tagline||x.category||tr('General services','Services généraux'))}</div></div><span class="spacer"></span><span class="pill">⌖ ${esc(x.city||'Local')}</span></div><div class="biz-tags">${(x.specialties||[]).slice(0,4).map(z=>`<span class="pill">${esc(z)}</span>`).join('')}</div><p class="small">${esc((x.description||tr('Company profile ready for project requests.','Fiche entreprise prête à recevoir des demandes.')).slice(0,190))}</p><div class="link-stack"><button class="btn primary" onclick="openBusinessProfile('${x.id}')">${tr('View company profile','Voir la fiche entreprise')}</button><button class="btn" onclick="track('direct_quote_start');directRequest('${x.id}')">${tr('Request a quote','Demander une soumission')}</button></div></div></div>`).join(''):`<div class="card muted">${tr('No companies listed yet.','Aucune entreprise inscrite pour le moment.')}</div>`}
function openBusinessProfile(id){let source=S.public?.businesses||S.state?.public?.businesses||[],x=source.find(b=>b.id===id);if(!x&&S.state?.profile?.id===id)x=S.state.profile;if(!x){toast(tr('Company not found.','Entreprise introuvable.'),false);return}let cover=x.banner_data_url?`style="background-image:linear-gradient(rgba(25,35,85,.12),rgba(25,35,85,.12)),url('${esc(x.banner_data_url)}')"`:'';modal(`<div class="company-profile-shell"><div class="company-hero" ${cover}></div><div class="company-profile-avatar">${x.logo_data_url?`<img src="${esc(x.logo_data_url)}">`:esc((x.name||'B')[0])}</div><div style="padding:0 20px 20px"><div class="toolbar"><div><h1 style="margin:10px 0 3px">${esc(x.name||'Business')}</h1><div class="muted">${esc(x.tagline||x.category||tr('General services','Services généraux'))} · ${esc(x.city||'Local')}</div></div><span class="spacer"></span><span class="pill good">${tr('Directory listing','Fiche du répertoire')}</span></div><div class="biz-tags">${(x.specialties||[]).map(z=>`<span class="pill">${esc(z)}</span>`).join('')}</div><p style="font-size:15px;line-height:1.65">${esc(x.description||tr('This company has not added a full description yet.','Cette entreprise n’a pas encore ajouté une description complète.'))}</p>${companyFacts(x)}${x.insurance_info?`<div class="option-note"><b>${tr('Insurance','Assurance')}:</b> ${esc(x.insurance_info)}</div>`:''}${(x.gallery||[]).length?`<div class="gallery-strip">${x.gallery.slice(0,6).map(g=>`<img src="${esc(g)}" alt="">`).join('')}</div>`:''}<div class="link-stack"><button class="btn primary big" onclick="closeModal();track('direct_quote_start');directRequest('${x.id}')">◆ ${tr('Request a quote','Demander une soumission')}</button>${companyLinks(x)}</div></div></div>`)}
function publicJobs(rows){return rows.length?rows.map(x=>`<div class="card job-market-card quest-card"><div class="job-topline"><div class="identity-dot">H</div><div><b>${tr('Homeowner project','Projet de propriétaire')}</b><div class="small muted">${tr('Client identity stays private','Identité du client protégée')}</div></div><span class="spacer"></span><span class="pill good">${esc(x.status||'open')}</span></div>${x.image_data_url?`<div class="job-image" style="background-image:url('${esc(x.image_data_url)}')"></div>`:''}<div class="job-body"><span class="pill">${esc(x.category||tr('Project','Projet'))}</span><h3 style="font-size:21px;margin-bottom:8px">${esc(x.title||tr('Home project','Projet résidentiel'))}</h3><div class="job-meta"><span class="pill">⌖ ${esc(x.city||tr('Location shared in ad','Lieu indiqué dans l’annonce'))}</span><span class="pill">◷ ${esc(x.timing||tr('Flexible timing','Délai flexible'))}</span>${x.budget?`<span class="pill gold">$ ${esc(x.budget)}</span>`:''}${x.property_type?`<span class="pill">⌂ ${esc(x.property_type)}</span>`:''}</div><p>${esc(x.description||'')}</p></div><div class="job-footer"><span class="small muted">${tr('Local listing + project brief. Private client identity.','Fiche locale + mandat de projet. Identité client privée.')}</span><span class="spacer"></span><button class="btn" onclick="openPublicJob('${x.id}')">${tr('View project','Voir le projet')}</button></div></div>`).join(''):`<div class="card muted">${tr('No open jobs yet.','Aucun projet ouvert pour le moment.')}</div>`}
function openPublicJob(id){let x=(S.public?.jobs||[]).find(j=>j.id===id);if(!x)return;modal(`<div class="quest-kicker">${tr('PUBLIC PROJECT AD','ANNONCE DE PROJET')}</div><h2>${esc(x.title||tr('Home project','Projet résidentiel'))}</h2>${x.image_data_url?`<div class="job-image" style="border-radius:16px;background-image:url('${esc(x.image_data_url)}')"></div>`:''}<div class="job-meta"><span class="pill">${esc(x.category||tr('Project','Projet'))}</span><span class="pill">⌖ ${esc(x.city||'')}</span><span class="pill">◷ ${esc(x.timing||tr('Flexible','Flexible'))}</span>${x.budget?`<span class="pill gold">$ ${esc(x.budget)}</span>`:''}${x.property_type?`<span class="pill">⌂ ${esc(x.property_type)}</span>`:''}</div><p style="line-height:1.65">${esc(x.description||'')}</p><div class="privacy-banner" style="padding:12px;border-radius:13px">${tr('The homeowner has no public profile. Businesses see the project ad, not the client’s private contact record.','Le propriétaire n’a pas de profil public. Les entreprises voient l’annonce du projet, pas les coordonnées privées du client.')}</div><br><button class="btn primary wide" onclick="closeModal();location.href='/admin'">${tr('Business login to respond','Connexion entreprise pour répondre')}</button>`)}
function portalJobCards(rows){return rows.length?rows.map(j=>`<div class="card job-market-card" style="margin:12px 0"><div class="job-topline"><div class="identity-dot">H</div><div><b>${tr('Homeowner opportunity','Occasion client')}</b><div class="small muted">${esc(j.city||'')} · ${esc(j.timing||tr('Flexible','Flexible'))}</div></div><span class="spacer"></span><span class="pill">${esc(j.category||tr('Project','Projet'))}</span></div>${j.image_data_url?`<div class="job-image" style="background-image:url('${esc(j.image_data_url)}')"></div>`:''}<div class="job-body"><h3>${esc(j.title||tr('Home project','Projet résidentiel'))}</h3><div class="job-meta">${j.budget?`<span class="pill gold">${tr('Budget','Budget')}: ${esc(j.budget)}</span>`:''}${j.property_type?`<span class="pill">⌂ ${esc(j.property_type)}</span>`:''}</div><p>${esc(j.description||'')}</p></div><div class="job-footer"><span class="small muted">${tr('Win on clarity, timing and scope.','Gagnez par la clarté, le délai et la portée.')}</span><span class="spacer"></span><button class="btn primary" onclick="showQuoteForm('${j.id}')">${tr('Send quote','Envoyer une soumission')}</button></div></div>`).join(''):`<p class="muted">${tr('No open jobs right now.','Aucun projet ouvert en ce moment.')}</p>`}

function showPortalProfile(){let p=S.state.profile||{},business=S.state.user.role==='business';if(!business){modal(`<h2>${tr('Private client profile','Profil client privé')}</h2><div class="privacy-banner" style="padding:12px;border-radius:13px;margin-bottom:12px">${tr('This profile is never published. Only your job ads become public.','Ce profil n’est jamais publié. Seules vos annonces de projets deviennent publiques.')}</div><div class="grid g2"><div class="field"><label>${tr('Name','Nom')}</label><input id="pfname" value="${esc(p.name||'')}"></div><div class="field"><label>Email</label><input id="pfemail" value="${esc(p.email||'')}"></div><div class="field"><label>${tr('Phone','Téléphone')}</label><input id="pfphone" value="${esc(p.phone||'')}"></div><div class="field"><label>${tr('City','Ville')}</label><input id="pfcity" value="${esc(p.city||'')}"></div></div><br><button class="btn primary" onclick="savePortalProfile()">${tr('Save private profile','Enregistrer le profil privé')}</button>`);return}let socials=p.social_links||{},custom=(p.custom_links||[]).map(x=>(x.label||'')+' | '+(x.url||'')).join('\n');modal(`<h2>${tr('Build your public company profile','Construisez votre fiche entreprise publique')}</h2><p class="muted small">${tr('Kijiji-style listing information + Linktree-style direct actions.','Information de fiche façon Kijiji + actions directes façon Linktree.')}</p><div class="grid g2"><div class="field"><label>${tr('Company name','Nom de l’entreprise')}</label><input id="pfname" value="${esc(p.name||'')}"></div><div class="field"><label>${tr('Tagline','Accroche')}</label><input id="pftag" value="${esc(p.tagline||'')}"></div><div class="field"><label>Email</label><input id="pfemail" value="${esc(p.email||'')}"></div><div class="field"><label>${tr('Phone','Téléphone')}</label><input id="pfphone" value="${esc(p.phone||'')}"></div><div class="field"><label>${tr('City','Ville')}</label><input id="pfcity" value="${esc(p.city||'')}"></div><div class="field"><label>${tr('Service area','Zone de service')}</label><input id="pfarea" value="${esc(p.service_area||'')}"></div><div class="field"><label>${tr('Category','Catégorie')}</label><input id="pfcat" value="${esc(p.category||'')}"></div><div class="field"><label>${tr('Years in business / experience','Années en affaires / expérience')}</label><input id="pfyears" value="${esc(p.years_in_business||'')}"></div><div class="field"><label>${tr('Website','Site Web')}</label><input id="pfweb" value="${esc(p.website||'')}"></div><div class="field"><label>${tr('Business hours','Heures d’ouverture')}</label><input id="pfhours" value="${esc(p.hours||'')}"></div></div><div class="field"><label>${tr('Specialties — comma separated','Spécialités — séparées par des virgules')}</label><input id="pfspec" value="${esc((p.specialties||[]).join(', '))}"></div><div class="field"><label>${tr('Company description','Description de l’entreprise')}</label><textarea id="pfdesc" rows="5">${esc(p.description||'')}</textarea></div><div class="grid g2"><div class="field"><label>${tr('Licence / credentials','Licence / qualifications')}</label><textarea id="pflicense" rows="3">${esc(p.license_info||'')}</textarea></div><div class="field"><label>${tr('Insurance','Assurance')}</label><textarea id="pfinsurance" rows="3">${esc(p.insurance_info||'')}</textarea></div></div><h3>${tr('Profile images','Images du profil')}</h3><div class="grid g2"><div class="field"><label>${tr('Company logo','Logo de l’entreprise')}</label><input id="pflogo" type="file" accept="image/*"><span class="small muted">${tr('Automatically compressed.','Compression automatique.')}</span></div><div class="field"><label>${tr('Cover image','Image de couverture')}</label><input id="pfbanner" type="file" accept="image/*"><span class="small muted">${tr('Landscape images work best.','Les images horizontales fonctionnent mieux.')}</span></div></div><div class="field"><label>${tr('Gallery — up to 6 images','Galerie — jusqu’à 6 images')}</label><input id="pfgallery" type="file" accept="image/*" multiple></div><h3>${tr('Linktree-style links','Liens façon Linktree')}</h3><div class="grid g2"><div class="field"><label>Instagram</label><input id="pfinstagram" value="${esc(socials.instagram||'')}"></div><div class="field"><label>Facebook</label><input id="pffacebook" value="${esc(socials.facebook||'')}"></div><div class="field"><label>TikTok</label><input id="pftiktok" value="${esc(socials.tiktok||'')}"></div><div class="field"><label>LinkedIn</label><input id="pflinkedin" value="${esc(socials.linkedin||'')}"></div></div><div class="field"><label>${tr('Custom links — one per line: Label | URL','Liens personnalisés — un par ligne : Libellé | URL')}</label><textarea id="pfcustom" rows="4">${esc(custom)}</textarea></div><br><button class="btn primary" onclick="savePortalProfile()">${tr('Publish profile updates','Publier les changements')}</button>`)}
async function savePortalProfile(){let business=S.state.user.role==='business',payload={name:$('#pfname').value,email:$('#pfemail').value,phone:$('#pfphone').value,city:$('#pfcity').value};try{if(business){payload.tagline=$('#pftag').value;payload.service_area=$('#pfarea').value;payload.category=$('#pfcat').value;payload.years_in_business=$('#pfyears').value;payload.website=$('#pfweb').value;payload.hours=$('#pfhours').value;payload.description=$('#pfdesc').value;payload.license_info=$('#pflicense').value;payload.insurance_info=$('#pfinsurance').value;payload.specialties=$('#pfspec').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20);payload.social_links={instagram:$('#pfinstagram').value,facebook:$('#pffacebook').value,tiktok:$('#pftiktok').value,linkedin:$('#pflinkedin').value};payload.custom_links=$('#pfcustom').value.split('\n').map(line=>{let [label,...u]=line.split('|');return{label:(label||'').trim(),url:u.join('|').trim()}}).filter(x=>x.url).slice(0,12);payload.logo_data_url=S.state.profile.logo_data_url||'';payload.banner_data_url=S.state.profile.banner_data_url||'';payload.gallery=[...(S.state.profile.gallery||[])];let lf=$('#pflogo').files?.[0],bf=$('#pfbanner').files?.[0],gfs=[...($('#pfgallery').files||[])].slice(0,6);if(lf)payload.logo_data_url=await imageToDataUrl(lf,640,.88);if(bf)payload.banner_data_url=await imageToDataUrl(bf,1500,.82);if(gfs.length)payload.gallery=[];for(let f of gfs)payload.gallery.push(await imageToDataUrl(f,1100,.8));payload.active=true}await api('update_portal_profile',payload);closeModal();S.state=await api('portal_state');renderPortal();toast(business?tr('Company listing updated.','Fiche entreprise mise à jour.'):tr('Private profile updated.','Profil privé mis à jour.'))}catch(e){toast(e.message,false)}}

function showPortalJob(){let cats=(S.state.public.tree.categories||[]).map(x=>`<option value="${esc(x.name)}">${esc(nodeLabel(x))}</option>`).join('');modal(`<h2>${tr('Post a public project ad','Publier une annonce de projet')}</h2><p class="muted small">${tr('The ad becomes public. Your client account, email and phone do not.','L’annonce devient publique. Votre compte client, courriel et téléphone ne le deviennent pas.')}</p><div class="field"><label>${tr('Title','Titre')}</label><input id="pjt"></div><div class="grid g2"><div class="field"><label>${tr('Category','Catégorie')}</label><select id="pjcat">${cats}</select></div><div class="field"><label>${tr('City','Ville')}</label><input id="pjcity"></div><div class="field"><label>${tr('Desired timing','Délai souhaité')}</label><input id="pjtime" placeholder="${tr('e.g. This week','ex. Cette semaine')}"></div><div class="field"><label>${tr('Budget range','Budget approximatif')}</label><input id="pjbudget" placeholder="$2,000–$4,000"></div><div class="field"><label>${tr('Property type','Type de propriété')}</label><select id="pjproperty"><option>${tr('House','Maison')}</option><option>${tr('Condo','Condo')}</option><option>${tr('Apartment','Appartement')}</option><option>${tr('Commercial','Commercial')}</option><option>${tr('Other','Autre')}</option></select></div><div class="field"><label>${tr('Project image (optional)','Image du projet (facultatif)')}</label><input id="pjimage" type="file" accept="image/*"></div></div><div class="field"><label>${tr('Project description','Description du projet')}</label><textarea id="pjdesc" rows="6"></textarea></div><br><button class="btn primary" onclick="portalCreateJob()">${tr('Publish project','Publier le projet')}</button>`)}
async function portalCreateJob(){try{let img='',f=$('#pjimage').files?.[0];if(f)img=await imageToDataUrl(f,1200,.82);await api('create_job',{title:$('#pjt').value,category:$('#pjcat').value,city:$('#pjcity').value,timing:$('#pjtime').value,budget:$('#pjbudget').value,property_type:$('#pjproperty').value,image_data_url:img,description:$('#pjdesc').value,status:'open'});closeModal();S.state=await api('portal_state');renderPortal();toast(tr('Job posted.','Projet publié.'))}catch(e){toast(e.message,false)}}

init().catch(e=>{$('#app').innerHTML=`<div class="auth-wrap"><div class="card"><h2>Startup error</h2><pre>${esc(e.message)}</pre></div></div>`});
</script></body></html>
